services:
  # Redis container (your Docker Hub image)
  redis:
    image: vaibhavakumarshrivastav/url-shortener-redis:latest
    volumes:
      - redis-data:/data        # keeps data across restarts
    restart: unless-stopped
    # no ports: only the app needs Redis, over the compose network

  # Node app container (your Docker Hub image)
  app:
    image: vaibhavakumarshrivastav/url-shortener:latest
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BASE_URL=http://localhost   # short links will start with this
    depends_on:
      redis:
        condition: service_healthy  # waits until Redis answers ping
    restart: unless-stopped
    # no ports: nginx is the entry point

  # Nginx container
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  redis-data: